name: hydro
on:
  schedule:
    - cron: '11 * * * *' # 每小时第11分钟抓（官方整点报汛后，错开整点高峰）
  workflow_dispatch: # 支持手动跑（Actions 页面 → Run workflow）

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node fetch.js
      - name: commit & push（GitHub 主仓）
        run: |
          git config user.name "hydro-bot"
          git config user.email "hydro-bot@users.noreply.github.com"
          git add data/hydro.json
          if git diff --cached --quiet; then echo "数据无变化"; exit 0; fi
          git commit -m "hydro $(date -u +%FT%TZ)"
          git push
      - name: 同步推 Gitee（国内访问 + 小程序域名白名单可加）
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_USER" ] || [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "Gitee secrets 未配置，跳过同步（配置方法见 SETUP.md）"; exit 0
          fi
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" || true
          git push -f gitee HEAD:master
      - name: 刷新 jsDelivr CDN 缓存（免认证，让备用地址也保持新鲜）
        run: |
          sleep 10
          curl -sfL "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/hydro.json" >/dev/null && echo "jsDelivr 已刷新" || echo "purge 失败（不阻塞）"
